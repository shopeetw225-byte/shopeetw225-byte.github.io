<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搬砖博主 · Demo 试玩 · 放置事务所</title><link rel="stylesheet" href="farming-creators.css"></head>
<body><main>
<header><p class="eyebrow">DEMO TRIALS / CREATOR RESEARCH</p><h1>搬砖博主</h1><p>围绕 Steam 桌面挂机、刷宝掉落与市场交易整理的 B站候选。先看同类作品，再决定邀请谁。</p><a class="back" href="../?trial=farming#demo-trials" target="_top">← 返回推广合作</a></header>
<section class="summary" aria-label="名单概况"><div><strong id="total">—</strong><span>位去重候选</span></div><div><strong id="recent">—</strong><span>位有近60天相关作品</span></div><div><strong id="selected">—</strong><span>位用户指定</span></div></section>
<p class="notice">这是研究名单。本次整理没有发送邀请；历史邀请和其他任务新发的邀请另按已核记录显示。较早作品单独标记，不代表作者仍在做同类内容。报价与合作意愿待洽谈。</p>
<form id="filters" role="search"><label class="search">搜索名字、UID或作品<input id="q" type="search" placeholder="例如：桌面破坏神、TBH、挂机"></label><label>题材<select id="category"><option value="">全部题材</option></select></label><label>分组<select id="tier"><option value="">全部分组</option><option>用户指定</option><option>同类近期</option><option>同类储备</option><option>相邻题材</option></select></label><label>邀请记录<select id="status"><option value="">全部状态</option><option value="unrecorded">本地未见发送记录</option><option value="recorded">有邀请记录</option></select></label></form>
<div class="results-bar"><p id="result-count" role="status" aria-live="polite">正在读取名单…</p><p id="checked"></p></div>
<div id="cards" class="cards"></div><nav id="pages" aria-label="名单分页"></nav>
<footer>账号按 UID 去重；每位附可打开的主页和相关视频。相关性判断来自已核题名、简介和作者信息，未逐一完整观看视频。标题中的收益数字仅为原题，不构成收益判断。</footer>
</main><script src="farming-creators.js"></script></body></html>
